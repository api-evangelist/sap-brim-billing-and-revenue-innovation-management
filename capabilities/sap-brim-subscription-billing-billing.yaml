naftiko: 1.0.0-alpha2
info:
  label: SAP BRIM (Billing and Revenue Innovation Management) SAP BRIM Subscription Billing API — Billing
  description: 'SAP BRIM (Billing and Revenue Innovation Management) SAP BRIM Subscription Billing API — Billing. 2 operations.
    Lead operation: SAP BRIM (Billing and Revenue Innovation Management) Get subscription billing history. Self-contained
    Naftiko capability covering one Sap Brim Billing And Revenue Innovation Management business surface.'
  tags:
  - Sap Brim Billing And Revenue Innovation Management
  - Billing
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SAP_BRIM_BILLING_AND_REVENUE_INNOVATION_MANAGEMENT_API_KEY: SAP_BRIM_BILLING_AND_REVENUE_INNOVATION_MANAGEMENT_API_KEY
capability:
  consumes:
  - type: http
    namespace: sap-brim-subscription-billing-billing
    baseUri: https://api.sap.com/subscription-billing/v1
    description: SAP BRIM (Billing and Revenue Innovation Management) SAP BRIM Subscription Billing API — Billing business
      capability. Self-contained, no shared references.
    resources:
    - name: subscriptions-subscriptionId-billing-history
      path: /subscriptions/{subscriptionId}/billing-history
      operations:
      - name: getsubscriptionbillinghistory
        method: GET
        description: SAP BRIM (Billing and Revenue Innovation Management) Get subscription billing history
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: subscriptions-subscriptionId-generate-invoice
      path: /subscriptions/{subscriptionId}/generate-invoice
      operations:
      - name: generateinvoice
        method: POST
        description: SAP BRIM (Billing and Revenue Innovation Management) Generate an invoice for a subscription
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.SAP_BRIM_BILLING_AND_REVENUE_INNOVATION_MANAGEMENT_API_KEY}}'
  exposes:
  - type: rest
    namespace: sap-brim-subscription-billing-billing-rest
    port: 8080
    description: REST adapter for SAP BRIM (Billing and Revenue Innovation Management) SAP BRIM Subscription Billing API —
      Billing. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/subscriptions/{subscriptionid}/billing-history
      name: subscriptions-subscriptionid-billing-history
      description: REST surface for subscriptions-subscriptionId-billing-history.
      operations:
      - method: GET
        name: getsubscriptionbillinghistory
        description: SAP BRIM (Billing and Revenue Innovation Management) Get subscription billing history
        call: sap-brim-subscription-billing-billing.getsubscriptionbillinghistory
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/subscriptions/{subscriptionid}/generate-invoice
      name: subscriptions-subscriptionid-generate-invoice
      description: REST surface for subscriptions-subscriptionId-generate-invoice.
      operations:
      - method: POST
        name: generateinvoice
        description: SAP BRIM (Billing and Revenue Innovation Management) Generate an invoice for a subscription
        call: sap-brim-subscription-billing-billing.generateinvoice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sap-brim-subscription-billing-billing-mcp
    port: 9090
    transport: http
    description: MCP adapter for SAP BRIM (Billing and Revenue Innovation Management) SAP BRIM Subscription Billing API —
      Billing. One tool per consumed operation, routed inline through this capability's consumes block.
    tools:
    - name: sap-brim-billing-and-revenue
      description: SAP BRIM (Billing and Revenue Innovation Management) Get subscription billing history
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sap-brim-subscription-billing-billing.getsubscriptionbillinghistory
      outputParameters:
      - type: object
        mapping: $.
    - name: sap-brim-billing-and-revenue-2
      description: SAP BRIM (Billing and Revenue Innovation Management) Generate an invoice for a subscription
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: sap-brim-subscription-billing-billing.generateinvoice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
